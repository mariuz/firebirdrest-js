name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # run by release.yml before publishing
  schedule:
    - cron: "23 5 * * 1" # weekly: catch changes in FirebirdREST and postgrest-js

jobs:
  test:
    name: test (Firebird ${{ matrix.firebird }}, FirebirdREST ${{ matrix.firebirdrest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firebird: ["3", "5"]
        firebirdrest: ["latest", "main"] # the released image, and a build of FirebirdREST's main branch
        include:
          # Firebird 6 (snapshot, until the release): SQL schemas, so the schema()
          # tests run instead of skipping. The database is UTF8 because the snapshot
          # truncates CHARACTER SET NONE columns for UTF8 clients.
          - firebird: 6-snapshot
            firebirdrest: latest
            charset: UTF8
            schemas: "public, inventory"
          - firebird: 6-snapshot
            firebirdrest: main
            charset: UTF8
            schemas: "public, inventory"
    services:
      firebird:
        image: firebirdsql/firebird:${{ matrix.firebird }}
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_DATABASE_DEFAULT_CHARSET: ${{ matrix.charset }}
        ports:
          - 3050:3050
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Load the FirebirdREST example database
        run: |
          curl -sSfL -o bookstore.sql https://raw.githubusercontent.com/mariuz/firebirdrest/main/examples/bookstore.sql
          for i in $(seq 1 30); do
            docker exec ${{ job.services.firebird.id }} test -f /var/lib/firebird/data/test.fdb && break
            sleep 2
          done
          sleep 3
          docker cp bookstore.sql ${{ job.services.firebird.id }}:/tmp/bookstore.sql
          docker exec ${{ job.services.firebird.id }} /opt/firebird/bin/isql \
            -user SYSDBA -password masterkey localhost:/var/lib/firebird/data/test.fdb -i /tmp/bookstore.sql
      - name: Add the Firebird 6 schema example
        if: matrix.schemas != ''
        run: |
          curl -sSfL -o bookstore-fb6.sql https://raw.githubusercontent.com/mariuz/firebirdrest/main/examples/bookstore-fb6.sql
          docker cp bookstore-fb6.sql ${{ job.services.firebird.id }}:/tmp/bookstore-fb6.sql
          docker exec ${{ job.services.firebird.id }} /opt/firebird/bin/isql \
            -user SYSDBA -password masterkey localhost:/var/lib/firebird/data/test.fdb -i /tmp/bookstore-fb6.sql
      - name: Build FirebirdREST from main
        if: matrix.firebirdrest == 'main'
        run: docker build -t ghcr.io/mariuz/firebirdrest:main https://github.com/mariuz/firebirdrest.git#main
      - name: Start FirebirdREST
        run: |
          docker run -d --name firebirdrest --network host \
            -e FBREST_DB_URI=authenticator:authenticator@localhost:3050/var/lib/firebird/data/test.fdb \
            -e FBREST_DB_ANON_ROLE=web_anon \
            -e FBREST_JWT_SECRET=reallyreallyreallyreallyverysafe1234 \
            -e FBREST_DB_PLAN_ENABLED=true \
            -e FBREST_DB_EVENTS=order_placed,stock_changed -e FBREST_DB_EVENTS_ROLES=web_user \
            ${{ matrix.schemas && format('-e FBREST_DB_SCHEMAS={0}', toJSON(matrix.schemas)) || '' }} \
            ghcr.io/mariuz/firebirdrest:${{ matrix.firebirdrest }}
          for i in $(seq 1 30); do
            curl -sf localhost:3000/ > /dev/null && break
            sleep 1
          done
          curl -sf 'localhost:3000/books?select=id&limit=1'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Test
        env:
          FIREBIRDREST_URL: http://localhost:3000
          FIREBIRDREST_JWT_SECRET: reallyreallyreallyreallyverysafe1234
        run: npm test
      - name: FirebirdREST log
        if: failure()
        run: docker logs firebirdrest
