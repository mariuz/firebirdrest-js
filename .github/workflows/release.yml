name: Release

# Publishes the package to npm when a version tag is pushed (v0.1.0), after
# the compatibility suite passes. The version in package.json must match the
# tag. Needs the NPM_TOKEN secret (see README, "Releasing").
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # provenance attestation on npm

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag but package.json says $version" >&2
            exit 1
          fi
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
